# Once a day: stamp the chain's newest line on Bitcoin with OpenTimestamps,
# and upgrade yesterday's pending proofs now that a block has confirmed them.
name: Bitcoin time stamp

on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the chain first
        run: node scripts/verify.mjs | tee verify.txt
      - name: Install the OpenTimestamps client
        run: pipx install opentimestamps-client==0.7.2
      - name: Upgrade pending proofs
        run: |
          shopt -s nullglob
          for proof in proofs/*.ots; do ots upgrade "$proof" || true; done
          rm -f proofs/*.ots.bak
      - name: Stamp today
        run: |
          day=$(date -u +%F)
          file="proofs/$day.txt"
          lines=$(ls chain/*.jsonl 2>/dev/null | xargs -r cat | grep -c . || true)
          # Nothing to stamp until the record holds something.
          if [ "${lines:-0}" != "0" ] && [ ! -f "$file" ]; then
            head=$(grep "Newest line's SHA-256" verify.txt | awk '{print $NF}')
            printf 'Edock News public record, %s\nchain lines: %s\nnewest line sha256: %s\ncommit: %s\n' "$day" "${lines:-0}" "$head" "$GITHUB_SHA" > "$file"
            ots stamp "$file"
          fi
          rm -f verify.txt
      - name: Commit
        run: |
          git config user.name "edock-news-stamp"
          git config user.email "support@edock.io"
          git add proofs
          git diff --cached --quiet && exit 0
          git commit -m "proofs: Bitcoin time stamp $(date -u +%F)"
          # Edock's server may have added a line meanwhile: replay on top, never force.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
